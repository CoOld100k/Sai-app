name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract and Build APK
        run: |
          # 1. فك ضغط الملف sai_app.zip
          unzip -o sai_app.zip

          # 2. الدخول للمجلد الداخلي sai_app
          cd sai_app

          # 3. عرض الملفات للتأكد
          ls -la

          # 4. جلب مكتبات مشروع الفلاتر وبناء الـ APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 5. نقل ملف الـ APK إلى المجلد الخارجي للتحميل
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
