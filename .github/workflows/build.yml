name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Detect Project and Build APK
        run: |
          # 1. البحث عن أي ملف مضغوط وفك ضغطه تلقائياً إن وجد
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "تم العثور على ملف مضغوط: $ZIP_FILE - جاري فك الضغط..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. البحث عن مكان وجود ملف pubspec.yaml في أي مكان بالخادم
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "خطأ: لم يتم العثور على ملف pubspec.yaml!"
            exit 1
          fi

          # 3. الدخول لمجلد المشروع الحقيقي
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "مسار المشروع المقروء هو: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 4. جلب المكتبات وبناء الـ APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 5. تجهيز ملف الـ APK النهائي للتنزيل
          mkdir -p "$GITHUB_WORKSPACE/output"
          find build/ -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output/app-release.apk" \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
