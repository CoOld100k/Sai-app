name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Zip and Flatten Files
        run: |
          # 1. فك ضغط ملف الـ ZIP
          unzip -o *.zip

          # 2. البحث عن مكان pubspec.yaml وتحديده تلقائياً
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)

          # 3. نقل كل ملفات المشروع إلى المجلد الرئيسي فوراً
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "تم العثور على الملفات في: $PROJECT_DIR"
          
          if [ "$PROJECT_DIR" != "." ]; then
            cp -rf "$PROJECT_DIR"/* .
          fi

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
