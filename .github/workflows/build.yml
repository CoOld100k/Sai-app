name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Any Zip File Automatically
        run: |
          # البحث عن أي ملف مضغوط zip واستخراجه تلقائياً
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          else
            echo "No zip file found!"
          fi

          # البحث عن ملف pubspec.yaml ونقل كافة الملفات للمجلد الرئيسي
          PUBSPEC=$(find . -iname "pubspec.yaml" -print -quit)
          if [ -n "$PUBSPEC" ]; then
            DIR=$(dirname "$PUBSPEC")
            echo "Project directory found at: $DIR"
            if [ "$DIR" != "." ]; then
              shopt -s dotglob
              cp -rf "$DIR"/* .
            fi
          else
            echo "ERROR: pubspec.yaml missing!"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
