name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Zip and Build APK
        run: |
          # فك ضغط الملف
          unzip -o *.zip || true
          
          # تحديد مجلد المشروع الذي يحتوي على pubspec.yaml
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1))
          echo "Project directory is: $PROJECT_DIR"
          
          # الدخول للمجلد والتنفيذ داخله مباشرة
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # نقل الـ APK الناتج لمكان التنزيل
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
