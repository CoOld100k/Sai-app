name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Zip and Build APK
        run: |
          # 1. فك ضغط الملف
          unzip -o sai_app.zip

          # 2. الدخول لمجلد sai_app الداخلي
          if [ -d "sai_app" ]; then
            cd sai_app
          fi

          # 3. بناء التطبيق من داخل مجلد المشروع
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 4. نقل ملف الـ APK الناتج للخارج لتسهيل تنزيله
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
